    M10 30 h80 a3 3 0 0 1 3 3 v14 a3 3 0 0 1 -3 3 h-80 a3 3 0 0 1 -3 -3 v-14 a3 3 0 0 1 3 -3 z
    M46 30 h8 v20 h-8 z
  "/>
  <path fill-rule="evenodd" d="
    M16 52 h68 v34 a7 7 0 0 1 -7 7 h-54 a7 7 0 0 1 -7 -7 z
    M46 52 h8 v41 h-8 z
  "/>
 </g>
 
    </g>
  </g>
</svg>