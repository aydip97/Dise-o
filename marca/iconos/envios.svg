<svg width="1080" height="1080" viewBox="0 0 1080 1080" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="fondo" cx="50%" cy="40%" r="74%">
      <stop offset="0%" stop-color="#1D3557"/>
      <stop offset="58%" stop-color="#13253F"/>
      <stop offset="100%" stop-color="#081321"/>
    </radialGradient>

    <linearGradient id="oroPieza" gradientUnits="userSpaceOnUse" x1="10" y1="0" x2="90" y2="100">
      <stop offset="0%" stop-color="#FCF2D6"/>
      <stop offset="24%" stop-color="#E0C489"/>
      <stop offset="52%" stop-color="#B08F49"/>
      <stop offset="74%" stop-color="#8A6A36"/>
      <stop offset="100%" stop-color="#E8D3A0"/>
    </linearGradient>

    <linearGradient id="oroAro" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F6E7BE"/>
      <stop offset="34%" stop-color="#C9A96A"/>
      <stop offset="66%" stop-color="#8E6F3C"/>
      <stop offset="100%" stop-color="#EBD7A6"/>
    </linearGradient>

    <filter id="bisel" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="5.5" result="desenfoque"/>
      <feSpecularLighting in="desenfoque" surfaceScale="9" specularConstant="1.15"
                          specularExponent="17" lighting-color="#FFF8E8" result="luz">
        <feDistantLight azimuth="232" elevation="54"/>
      </feSpecularLighting>
      <feComposite in="luz" in2="SourceAlpha" operator="in" result="luzRecortada"/>
      <feComposite in="SourceGraphic" in2="luzRecortada" operator="arithmetic"
                   k1="0" k2="1" k3="1" k4="0" result="iluminado"/>
      <feSpecularLighting in="desenfoque" surfaceScale="9" specularConstant="0.95"
                          specularExponent="17" lighting-color="#0A1A33" result="sombra">
        <feDistantLight azimuth="52" elevation="54"/>
      </feSpecularLighting>
      <feComposite in="sombra" in2="SourceAlpha" operator="in" result="sombraRecortada"/>
      <feComposite in="iluminado" in2="sombraRecortada" operator="arithmetic"
                   k1="0" k2="1" k3="-1" k4="0"/>
    </filter>

    <filter id="biselFino" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" result="desenfoque"/>
      <feSpecularLighting in="desenfoque" surfaceScale="6" specularConstant="1.2"
                          specularExponent="16" lighting-color="#FFF8E8" result="luz">
        <feDistantLight azimuth="232" elevation="56"/>
      </feSpecularLighting>
      <feComposite in="luz" in2="SourceAlpha" operator="in" result="luzRecortada"/>
      <feComposite in="SourceGraphic" in2="luzRecortada" operator="arithmetic"
                   k1="0" k2="1" k3="1" k4="0" result="iluminado"/>
      <feSpecularLighting in="desenfoque" surfaceScale="6" specularConstant="1"
                          specularExponent="16" lighting-color="#0A1A33" result="sombra">
        <feDistantLight azimuth="52" elevation="56"/>
      </feSpecularLighting>
      <feComposite in="sombra" in2="SourceAlpha" operator="in" result="sombraRecortada"/>
      <feComposite in="iluminado" in2="sombraRecortada" operator="arithmetic"
                   k1="0" k2="1" k3="-1" k4="0"/>
    </filter>

    <filter id="proyectada" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#040B15" flood-opacity="0.62"/>
    </filter>
  </defs>

  <rect width="1080" height="1080" fill="url(#fondo)"/>

  <g filter="url(#proyectada)">
    <circle cx="540" cy="540" r="406" fill="none" stroke="url(#oroAro)" stroke-width="11" filter="url(#bisel)"/>
  </g>
  <circle cx="540" cy="540" r="352" fill="none" stroke="#C9A96A" stroke-opacity=".55"
          stroke-width="7" stroke-linecap="round" stroke-dasharray="0.5 29"/>

  <g fill="url(#oroAro)">
    <rect x="531" y="115" width="18" height="18" transform="rotate(45 540 124)"/>
    <rect x="531" y="947" width="18" height="18" transform="rotate(45 540 956)"/>
    <rect x="115" y="531" width="18" height="18" transform="rotate(45 124 540)"/>
    <rect x="947" y="531" width="18" height="18" transform="rotate(45 956 540)"/>
  </g>

  <g filter="url(#proyectada)">
    <g transform="translate(275 275) scale(5.3)" fill="url(#oroPieza)">

  <g filter="url(#bisel)">
  <path d="M46 28 c-13 0 -22 -5 -22 -12 c0 -6 6 -9 12 -6 c6 3 9 10 10 18 z"/>
  <path d="M54 28 c13 0 22 -5 22 -12 c0 -6 -6 -9 -12 -6 c-6 3 -9 10 -10 18 z"/>
